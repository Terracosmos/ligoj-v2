name: CI

on:
  push:
    branches: [vue3-migration]
  pull_request:
    branches: [vue3-migration]

defaults:
  run:
    working-directory: app-ui/src/main/webapp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-ui/src/main/webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
