name: CI

on:
  push:
    branches: [vue3-migration]
  pull_request:
    branches: [vue3-migration]

defaults:
  run:
    working-directory: app-ui/src/main/webapp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-ui/src/main/webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      ligoj:
        image: ligoj/ligoj-api:4.0.0
        ports:
          - 8680:8081
        options: >-
          --health-cmd "curl -f http://localhost:8081/ligoj/rest/system || exit 1"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 120s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-ui/src/main/webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npx playwright test
        env:
          BASE_URL: http://localhost:8680/ligoj/

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app-ui/src/main/webapp/test-results/
          retention-days: 7
